    <script type="text/javascript">
      // 如果是桌面端浏览器，就跳转到桌面端
      const isDesktop = window.innerWidth > 880
      if (isDesktop) {
        window.location.href = window.location.origin.replace(window.location.port, window.location.port + 1)
      }
    </script>
